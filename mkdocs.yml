site_name: lelyetia的个人知识库
site_url: https://lelyetia.github.io/lelyetia-knowledge/

theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - content.footnote.tooltips
    - navigation.top
    - toc.follow

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
  - footnotes:
      SUPERSCRIPT_TEXT: '[{}]'
      BACKLINK_TITLE: '返回正文中的引用 {}'
  - toc:
      permalink: true
      permalink_title: 本节固定链接
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

hooks:
  - hooks/note_versions.py

extra_css:
  - stylesheets/notebook.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 知识库介绍: main_page.md
  - 实用工具:
      - 总览: practical-tools/index.md
      - Git语法: practical-tools/git.md
      - Markdown语法: practical-tools/markdown.md
  - 科研工具:
      - 总览: research-tools/index.md
      - Zotero: research-tools/zotero.md
      - Obsidian: research-tools/obsidian.md
  - 学习资源:
      - 总览: learning-resources/index.md
      - 计算机科学基础:
          - 分类总览: learning-resources/fundamentals-of-computer/index.md
          - CS50x: learning-resources/fundamentals-of-computer/CS50x.md
      - 机器学习:
          - 分类总览: learning-resources/machine-learning/index.md
          - 机器学习（西瓜书）与南瓜书: learning-resources/machine-learning/machine-learning-watermelon-pumpkin.md
      - 深度学习:
          - 分类总览: learning-resources/deep-learning/index.md
          - 深度学习入门（鱼书）: learning-resources/deep-learning/deep-learning-from-scratch.md
          - 动手学深度学习（书籍）: learning-resources/deep-learning/dive-into-deep-learning.md
          - 动手学深度学习 v2（课程）: learning-resources/deep-learning/d2l-v2.md
          - PyTorch 入门课程（小土堆）: learning-resources/deep-learning/pytorch-xiaotudui.md
      - 计算机视觉:
          - 分类总览: learning-resources/computer-vision/index.md
          - OpenCV 计算机视觉开发实践: learning-resources/computer-vision/opencv-python-practice.md
          - DeepLearning-Empirical-Studies: learning-resources/computer-vision/deep-learning-empirical-studies.md
